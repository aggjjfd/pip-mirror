name: Test Package Installation

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name to test'
        required: true
      version:
        description: 'Version (empty for latest)'
        required: false
        default: ''
      python_version:
        description: 'Python version'
        required: false
        default: '3.12'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      package: ${{ steps.info.outputs.package }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ github.event.inputs.python_version }}'
      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'
      - run: uv sync --no-dev
      - name: Sync package
        run: uv run pip-mirror sync --packages "${{ github.event.inputs.package }}"
      - id: info
        run: |
          echo "package=${{ github.event.inputs.package }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: test-pkg-${{ github.run_id }}
          path: packages/
          retention-days: 1
          compression-level: 0

  test-linux:
    needs: sync
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/download-artifact@v4
        with:
          name: test-pkg-${{ github.run_id }}
          path: packages/
      - name: Generate index
        run: |
          pip install packaging requests tqdm tomli 2>/dev/null || true
          python3 -c "import sys; sys.path.insert(0, 'src'); from pip_mirror.indexer import generate_index; from pathlib import Path; generate_index(Path('packages'))"
      - name: Test install
        run: |
          PKG="${{ needs.sync.outputs.package }}"
          VER="${{ needs.sync.outputs.version }}"
          INDEX="file://$(pwd)/packages/simple"
          echo "Testing: $PKG"
          echo "Python: $(python --version)"
          echo "Index: $INDEX"
          if [ -n "$VER" ]; then
            pip install --index-url "$INDEX" --trusted-host localhost --no-cache-dir "$PKG==$VER"
          else
            pip install --index-url "$INDEX" --trusted-host localhost --no-cache-dir "$PKG"
          fi
          python -c "import $PKG; print('import OK')" 2>/dev/null || echo "import skipped"

  test-windows:
    needs: sync
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      matrix:
        python: ['3.8', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/download-artifact@v4
        with:
          name: test-pkg-${{ github.run_id }}
          path: packages/
      - name: Generate index
        shell: pwsh
        run: |
          pip install packaging requests tqdm tomli 2>$null
          python -c "import sys; sys.path.insert(0, 'src'); from pip_mirror.indexer import generate_index; from pathlib import Path; generate_index(Path('packages'))"
      - name: Test install
        shell: pwsh
        run: |
          $pkg = "${{ needs.sync.outputs.package }}"
          $ver = "${{ needs.sync.outputs.version }}"
          $idx = "file:///$((Get-Location).Path.Replace('\', '/'))/packages/simple"
          Write-Host "Testing: $pkg"
          Write-Host "Python: $(python --version)"
          Write-Host "Index: $idx"
          if ($ver) {
            pip install --index-url $idx --trusted-host localhost --no-cache-dir "$pkg==$ver"
          } else {
            pip install --index-url $idx --trusted-host localhost --no-cache-dir $pkg
          }
          python -c "import $pkg; print('import OK')" 2>$null
