name: Sync PyPI Mirror

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '要同步的包列表(空格分隔,空则使用配置文件中默认的)'
        required: false
        default: ''
      max_versions:
        description: '每个包保留的最新版本数(留空走 config)'
        required: false
        default: ''
      no_deps:
        description: '是否跳过依赖下载'
        required: false
        default: 'false'
      index_url:
        description: 'PyPI 镜像源 URL(留空走 config)'
        required: false
        default: ''

  schedule:
    - cron: '0 3 * * 1'

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Override config from inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          MAX_VERSIONS = "${{ github.event.inputs.max_versions }}"
          INDEX_URL = "${{ github.event.inputs.index_url }}"
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")

          if MAX_VERSIONS.strip():
              text = re.sub(
                  r"(?m)^(max_versions\s*=\s*)\d+",
                  f"\\g<1>{int(MAX_VERSIONS)}",
                  text,
              )
              print(f"max_versions overridden -> {MAX_VERSIONS}")

          if INDEX_URL.strip():
              text = re.sub(
                  r"(?m)^(index_url\s*=\s*).+$",
                  f'\\g<1>"{INDEX_URL}"',
                  text,
              )
              if "index_url" not in text:
                  text += f'\nindex_url = "{INDEX_URL}"\n'
              print(f"index_url overridden -> {INDEX_URL}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Show config
        run: |
          echo "===== 同步配置 ====="
          grep -A 50 '\[tool.pip-mirror\]' pyproject.toml | head -60 || true
          echo "===================="

      - name: Run sync-full
        id: sync
        run: |
          mkdir -p packages incremental

          ARGS=""
          if [ -n "${{ github.event.inputs.packages }}" ]; then
            ARGS="$ARGS --packages ${{ github.event.inputs.packages }}"
          fi
          if [ "${{ github.event.inputs.no_deps }}" = "true" ]; then
            ARGS="$ARGS --no-deps"
          fi

          echo "===== 开始全量同步 ====="
          uv run pip-mirror sync-full $ARGS 2>&1 | tee sync.log
          echo "===== 全量同步结束 ====="

      - name: Generate report
        if: always()
        run: |
          echo "===== 下载报告 =====" > report.txt
          echo "生成时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> report.txt
          echo "Runner: $(uname -a)" >> report.txt
          echo "" >> report.txt

          if [ -f packages/.store.db ]; then
            echo "--- SQLite 下载记录统计 ---" >> report.txt
            sqlite3 packages/.store.db "SELECT '总文件数: ' || COUNT(*) FROM downloaded_files;" >> report.txt
            sqlite3 packages/.store.db "SELECT '总包数: ' || COUNT(DISTINCT package_name) FROM downloaded_files;" >> report.txt
            sqlite3 packages/.store.db "SELECT package_name, COUNT(*) as files, COUNT(DISTINCT version) as versions FROM downloaded_files GROUP BY package_name ORDER BY files DESC LIMIT 20;" >> report.txt
            echo "" >> report.txt
          fi

          echo "--- 仓库目录大小 ---" >> report.txt
          du -sh packages/ 2>/dev/null || echo "packages/ 不存在" >> report.txt
          echo "" >> report.txt

          echo "--- 各包目录大小 ---" >> report.txt
          if [ -d packages/simple ]; then
            du -sh packages/simple/*/ 2>/dev/null | sort -rh | head -30 >> report.txt
          fi
          echo "" >> report.txt

          echo "--- Python 解释器 ---" >> report.txt
          if [ -f packages/python-builds/index.json ]; then
            echo "Python builds index: $(wc -c < packages/python-builds/index.json) bytes" >> report.txt
            python3 -c "import json; d=json.load(open('packages/python-builds/index.json')); print(f'条目数: {len(d)}'); [print(f'  {k}') for k in sorted(d.keys())]" >> report.txt
            du -sh packages/python-builds/ 2>/dev/null >> report.txt
          else
            echo "无 Python 解释器下载" >> report.txt
          fi
          echo "" >> report.txt

          echo "--- 全量包 ---" >> report.txt
          ls -lh mirror.tar.gz mirror.sha256 2>/dev/null || echo "未生成 mirror.tar.gz" >> report.txt
          echo "" >> report.txt

          echo "--- 最近日志 (末尾 100 行) ---" >> report.txt
          tail -n 100 sync.log 2>/dev/null >> report.txt

          cat report.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-mirror-${{ github.run_id }}
          path: |
            mirror.tar.gz
            mirror.sha256
            report.txt
            sync.log
          retention-days: 7
          compression-level: 0
