name: Sync PyPI Mirror

on:
  # 手动触发，支持参数
  workflow_dispatch:
    inputs:
      packages:
        description: '要同步的包列表（空格分隔，空则使用配置文件中默认的）'
        required: false
        default: ''
      max_versions:
        description: '每个包保留的最新版本数'
        required: false
        default: '5'
      no_deps:
        description: '是否跳过依赖下载'
        required: false
        default: 'false'
      index_url:
        description: 'PyPI 镜像源 URL'
        required: false
        default: 'https://mirrors.ustc.edu.cn/pypi/simple'

  # 定时触发：每周一凌晨 3 点
  schedule:
    - cron: '0 3 * * 1'

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Show config
        run: |
          echo "===== 同步配置 ====="
          echo "PyPI 镜像源: ${{ github.event.inputs.index_url || 'https://mirrors.ustc.edu.cn/pypi/simple' }}"
          echo "最大版本数: ${{ github.event.inputs.max_versions || '5' }}"
          echo "跳过依赖: ${{ github.event.inputs.no_deps || 'false' }}"
          if [ -n "${{ github.event.inputs.packages }}" ]; then
            echo "指定包: ${{ github.event.inputs.packages }}"
          else
            echo "使用 pyproject.toml 默认包列表"
            grep -A 50 '\[tool.pip-mirror\]' pyproject.toml | grep 'packages' -A 40 || true
          fi
          echo "===================="

      - name: Sync packages
        id: sync
        run: |
          mkdir -p packages incremental

          SYNC_ARGS=""
          if [ -n "${{ github.event.inputs.packages }}" ]; then
            SYNC_ARGS="$SYNC_ARGS --packages ${{ github.event.inputs.packages }}"
          fi
          if [ "${{ github.event.inputs.no_deps }}" = "true" ]; then
            SYNC_ARGS="$SYNC_ARGS --no-deps"
          fi

          echo "===== 开始同步 ====="
          uv run pip-mirror sync $SYNC_ARGS 2>&1 | tee sync.log
          SYNC_EXIT=${PIPESTATUS[0]}
          echo "===== 同步结束 (exit=$SYNC_EXIT) ====="
          exit $SYNC_EXIT

      - name: Generate report
        if: always()
        run: |
          echo "===== 下载报告 =====" > report.txt
          echo "生成时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> report.txt
          echo "Runner: $(uname -a)" >> report.txt
          echo "" >> report.txt

          if [ -f packages/.store.db ]; then
            echo "--- SQLite 下载记录统计 ---" >> report.txt
            sqlite3 packages/.store.db "SELECT '总文件数: ' || COUNT(*) FROM downloaded_files;" >> report.txt
            sqlite3 packages/.store.db "SELECT '总包数: ' || COUNT(DISTINCT package_name) FROM downloaded_files;" >> report.txt
            sqlite3 packages/.store.db "SELECT package_name, COUNT(*) as files, COUNT(DISTINCT version) as versions FROM downloaded_files GROUP BY package_name ORDER BY files DESC LIMIT 20;" >> report.txt
            echo "" >> report.txt
          fi

          echo "--- 仓库目录大小 ---" >> report.txt
          du -sh packages/ 2>/dev/null || echo "packages/ 不存在" >> report.txt
          du -sh incremental/ 2>/dev/null || echo "incremental/ 不存在" >> report.txt
          echo "" >> report.txt

          echo "--- 各包目录大小 ---" >> report.txt
          if [ -d packages/simple ]; then
            du -sh packages/simple/*/ 2>/dev/null | sort -rh | head -30 >> report.txt
          fi
          echo "" >> report.txt

          echo "--- 增量包列表 ---" >> report.txt
          ls -lh incremental/ 2>/dev/null || echo "无增量包" >> report.txt
          echo "" >> report.txt

          echo "--- 最近日志 (末尾 100 行) ---" >> report.txt
          tail -n 100 sync.log 2>/dev/null >> report.txt

          cat report.txt

      - name: Upload incremental + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-mirror-incremental-${{ github.run_id }}
          path: |
            incremental/
            report.txt
            sync.log
          retention-days: 7
          compression-level: 9
