name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
            zigbuild: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: ''
            zigbuild: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
            zigbuild: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install zig and cargo-zigbuild (for arm64 with old glibc)
        if: matrix.zigbuild
        run: |
          curl -L https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ -C /tmp
          echo "/tmp/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.zigbuild }}" == "true" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}.2.17
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Rename binary with version and target
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="target/${{ matrix.target }}/release/pip-mirror${{ matrix.suffix }}"
          DST="pip-mirror-${VERSION}-${{ matrix.target }}${{ matrix.suffix }}"
          cp "${SRC}" "${DST}"
          echo "dst=${DST}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip-mirror-${{ matrix.target }}
          path: ${{ env.dst }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pip-mirror-*

      - name: Build release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"

          # Extract changelog section for this version
          awk -v ver="[$VERSION]" '
            $0 ~ "^## " ver { found=1; next }
            found && $0 ~ "^## " { found=0 }
            found { print }
          ' CHANGELOG.md > changelog-section.md

          cat <<'BODY' > release-body.md
          ## 下载

          | 平台 | 文件名 |
          |------|--------|
          | Linux x86_64 | `pip-mirror-TAG-x86_64-unknown-linux-gnu` |
          | Linux arm64 (glibc >= 2.17) | `pip-mirror-TAG-aarch64-unknown-linux-gnu` |
          | Windows x86_64 | `pip-mirror-TAG-x86_64-pc-windows-msvc.exe` |

          ## 快速开始

          ```bash
          # Linux
          chmod +x pip-mirror-TAG-x86_64-unknown-linux-gnu
          ./pip-mirror-TAG-x86_64-unknown-linux-gnu --help

          # Windows（PowerShell）
          .\\pip-mirror-TAG-x86_64-pc-windows-msvc.exe --help
          ```

          BODY
          sed -i "s/TAG/${TAG}/g" release-body.md

          if [ -s changelog-section.md ]; then
            echo "" >> release-body.md
            cat changelog-section.md >> release-body.md
          fi

          echo "release_body<<EOF" >> "$GITHUB_ENV"
          cat release-body.md >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*pip-mirror-*
          body: ${{ env.release_body }}
          generate_release_notes: true
