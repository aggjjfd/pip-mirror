name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary with version and target
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="target/${{ matrix.target }}/release/pip-mirror${{ matrix.suffix }}"
          DST="pip-mirror-${VERSION}-${{ matrix.target }}${{ matrix.suffix }}"
          cp "${SRC}" "${DST}"
          echo "dst=${DST}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip-mirror-${{ matrix.target }}
          path: ${{ env.dst }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pip-mirror-*

      - name: Build release notes
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cat <<'BODY' > release-body.md
          ## 下载

          | 平台 | 文件名 |
          |------|--------|
          | Linux x86_64 | `pip-mirror-<<<VERSION>>>-x86_64-unknown-linux-gnu` |
          | Windows x86_64 | `pip-mirror-<<<VERSION>>>-x86_64-pc-windows-msvc.exe` |

          ## 快速开始

          ```bash
          # Linux
          chmod +x pip-mirror-<<<VERSION>>>-x86_64-unknown-linux-gnu
          ./pip-mirror-<<<VERSION>>>-x86_64-unknown-linux-gnu --help

          # Windows（PowerShell）
          .\\pip-mirror-<<<VERSION>>>-x86_64-pc-windows-msvc.exe --help
          ```

          ## 功能亮点

          - 内网私有 PyPI 镜像（PEP 503 / PEP 691）
          - 增量/全量同步 PyPI 包
          - 自动解析目标环境依赖
          - 内嵌 uv 安装器（内网一键安装 uv）
          - Web 首页 + 包搜索

          BODY
          sed -i "s/<<<VERSION>>>/${VERSION}/g" release-body.md
          echo "release_body<<EOF" >> "$GITHUB_ENV"
          cat release-body.md >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*pip-mirror-*
          body: ${{ env.release_body }}
          generate_release_notes: true
