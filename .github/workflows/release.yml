name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary with version and target
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC="target/${{ matrix.target }}/release/pip-mirror${{ matrix.suffix }}"
          DST="pip-mirror-${VERSION}-${{ matrix.target }}${{ matrix.suffix }}"
          cp "${SRC}" "${DST}"
          echo "dst=${DST}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip-mirror-${{ matrix.target }}
          path: ${{ env.dst }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pip-mirror-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*pip-mirror-*
          generate_release_notes: true
