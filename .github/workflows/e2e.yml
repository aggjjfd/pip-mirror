name: E2E (Four Modes)

# 端到端测试, 模拟"外网-内网"双机部署完整链路：
#   1) 外网机 sync-full 全量同步 → 产 mirror.tar.zst
#   2) artifact 转移: mirror.tar.zst 拷贝到内网机
#   3) 内网机解压并 serve → 客户端第一次下载验证
#   4) 外网机模拟"清包留库": 删除 simple/ + python-builds/ 仅保留 .store.db
#   5) 外网机 sync 增量同步 → 产 incremental_*.tar.zst（此时外网只剩数据库没有包）
#   6) artifact 转移: incremental_*.tar.zst + 更新后的 .store.db 拷贝到内网机
#   7) 内网机 import-incremental → 重建索引
#   8) 客户端第二次下载验证（增量包 + 旧包仍可用）
#
# 用 /tmp/wan 与 /tmp/lan 两个独立目录模拟两台机器,
# 以文件拷贝代替真实内外网数据搬运。
#
# 包列表分两组：
#   sync-full 子集（5 包）: rapidocr-onnxruntime + pyside6 + playwright + openai + requests
#   incremental 追加（3 深依赖包）: gradio + streamlit + markitdown[pptx,docx,xls,xlsx,pdf]
#
# CI 上 CPU 弱网络强：
#   - resolve/download 并发拉到 16，metadata 并发拉到 32

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIRROR_HOST: 127.0.0.1
      MIRROR_PORT: '18080'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Build pip-mirror (Rust)
        run: |
          set -euo pipefail
          rustup default stable
          cargo build --release
          echo "PIP_MIRROR_BIN=$(pwd)/target/x86_64-unknown-linux-gnu/release/pip-mirror" >> "$GITHUB_ENV"

      - name: '生成三机配置（外网全量 / 外网增量 / 内网 serve）'
        run: |
          set -euo pipefail
          cat > wan-full.toml <<'TOML'
          packages = [
              "rapidocr-onnxruntime",
              "pyside6",
              "playwright",
              "openai",
              "requests",
          ]
          repository_dir = "/tmp/wan/packages"
          incremental_dir = "/tmp/wan/incremental"
          include_source = true
          resolve_workers = 16
          metadata_workers = 32
          download_workers = 16
          top_versions_per_package = 5
          adjacent_versions_per_side = 3
          TOML
          cat > wan-inc.toml <<'TOML'
          packages = [
              "rapidocr-onnxruntime",
              "pyside6",
              "playwright",
              "openai",
              "requests",
              "gradio",
              "streamlit",
              "markitdown[pptx,docx,xls,xlsx,pdf]",
          ]
          repository_dir = "/tmp/wan/packages"
          incremental_dir = "/tmp/wan/incremental"
          include_source = true
          resolve_workers = 16
          metadata_workers = 32
          download_workers = 16
          top_versions_per_package = 5
          TOML
          cat > lan.toml <<'TOML'
          packages = ["requests"]
          repository_dir = "/tmp/lan/packages"
          incremental_dir = "/tmp/lan/incremental"
          server_host = "127.0.0.1"
          server_port = 18080
          TOML
          echo "----- wan-full.toml -----"
          cat wan-full.toml
          echo "----- wan-inc.toml -----"
          cat wan-inc.toml
          echo "----- lan.toml -----"
          cat lan.toml

      - name: '外网机 — sync-full 全量同步（产 mirror.tar.zst）'
        run: |
          set -euo pipefail
          mkdir -p /tmp/wan
          cd /tmp/wan
          $PIP_MIRROR_BIN sync-full -c "$GITHUB_WORKSPACE/wan-full.toml" 2>&1 | tee sync-full.log
          ls -lh mirror.tar.zst mirror.sha256
          sha256sum -c mirror.sha256
          # 验证外网机仓库结构
          if [ ! -d /tmp/wan/packages/simple/requests ]; then
            echo "BUG: /tmp/wan/packages/simple/requests 缺失"
            ls -la /tmp/wan/packages || true
            ls -la /tmp/wan/packages/simple || true
            exit 1
          fi
          if [ ! -f /tmp/wan/packages/.store.db ]; then
            echo "BUG: /tmp/wan/packages/.store.db 缺失"
            ls -la /tmp/wan/packages || true
            exit 1
          fi
          if [ ! -f /tmp/wan/packages/python-builds/index.json ]; then
            echo "BUG: /tmp/wan/packages/python-builds/index.json 缺失"
            ls -la /tmp/wan/packages || true
            ls -la /tmp/wan/packages/python-builds || true
            exit 1
          fi
          echo "外网机仓库尺寸:"
          du -sh /tmp/wan/packages

      - name: 'artifact 转移 — mirror.tar.zst 外网→内网'
        run: |
          set -euo pipefail
          mkdir -p /tmp/lan
          cp /tmp/wan/mirror.tar.zst /tmp/wan/mirror.sha256 /tmp/lan/
          echo "mirror.tar.zst 已拷贝到内网机 /tmp/lan/"
          ls -lh /tmp/lan/mirror.tar.zst

      - name: '内网机 — 解压 mirror.tar.zst 并验证'
        run: |
          set -euo pipefail
          cd /tmp/lan
          tar -xaf mirror.tar.zst
          test -d /tmp/lan/packages/simple/requests
          test -f /tmp/lan/packages/simple/requests/index.html
          test -f /tmp/lan/packages/simple/requests/index.json
          test -f /tmp/lan/packages/.store.db
          test -f /tmp/lan/packages/python-builds/index.json
          # access_log.db 不应进 mirror.tar.zst
          if [ -f /tmp/lan/packages/.access_log.db ]; then
            echo "BUG: .access_log.db should be filtered out of mirror.tar.zst"
            exit 1
          fi
          echo "内网机 simple/ (head 10):"
          ls /tmp/lan/packages/simple/ | head -10
          echo "内网机 python-builds/ (head 5):"
          ls /tmp/lan/packages/python-builds/ | head -5
          echo "python-builds index entries: $(python -c 'import json; print(len(json.load(open("/tmp/lan/packages/python-builds/index.json"))))')"
          echo "内网机仓库尺寸:"
          du -sh /tmp/lan/packages

      - name: '内网机 — serve 启动（后台）'
        run: |
          set -euo pipefail
          $PIP_MIRROR_BIN serve -c "$GITHUB_WORKSPACE/lan.toml" > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf "http://${MIRROR_HOST}:${MIRROR_PORT}/simple/requests/" > /dev/null; then
              echo "内网 server up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sfI "http://${MIRROR_HOST}:${MIRROR_PORT}/simple/requests/" | head -3
          curl -sf "http://${MIRROR_HOST}:${MIRROR_PORT}/python-builds/index.json" \
            | python -c 'import json, sys; d=json.load(sys.stdin); k=next(iter(d)); print(len(d), "entries; first:", k, "->", d[k]["url"])'

      - name: '客户端第一次下载 — uv pip install requests via 内网镜像'
        run: |
          set -euo pipefail
          uv venv /tmp/client1
          export VIRTUAL_ENV=/tmp/client1
          uv pip install --index-url "http://${MIRROR_HOST}:${MIRROR_PORT}/simple" requests
          /tmp/client1/bin/python -c "import requests; print('client1 requests', requests.__version__)"

      - name: '客户端第一次下载 — uv python install 3.12 via 内网镜像'
        run: |
          set -euo pipefail
          export UV_PYTHON_DOWNLOADS_JSON_URL="http://${MIRROR_HOST}:${MIRROR_PORT}/python-builds/index.json"
          export UV_PYTHON_INSTALL_DIR=/tmp/uv-pythons
          export UV_PYTHON_PREFERENCE=only-managed
          uv python install 3.12
          ls /tmp/uv-pythons
          PYBIN=$(uv python find 3.12)
          echo "uv python find 3.12 → $PYBIN"
          "$PYBIN" --version
          # 确认服务器真的被打过 python-builds 流量
          PYHITS=$(sqlite3 /tmp/lan/packages/.access_log.db \
            "SELECT COUNT(*) FROM access_log WHERE path LIKE '/python-builds/%';")
          echo "python-builds hits in mirror access_log: $PYHITS"
          test "$PYHITS" -ge 1

      - name: '外网机 — 模拟清包留库（仅保留 .store.db + .access_log.db）'
        run: |
          set -euo pipefail
          echo "清包前外网机 packages/ 内容:"
          ls -la /tmp/wan/packages/
          rm -rf /tmp/wan/packages/simple
          rm -rf /tmp/wan/packages/python-builds
          echo "清包后外网机 packages/ 内容（应只剩 .store.db 与 .access_log.db）:"
          ls -la /tmp/wan/packages/
          # 确认包目录已被清空
          if [ -d /tmp/wan/packages/simple ]; then
            echo "BUG: simple/ 目录应已被删除"
            exit 1
          fi
          if [ -d /tmp/wan/packages/python-builds ]; then
            echo "BUG: python-builds/ 目录应已被删除"
            exit 1
          fi
          # .store.db 必须保留
          if [ ! -f /tmp/wan/packages/.store.db ]; then
            echo "BUG: .store.db 必须保留"
            exit 1
          fi
          echo "外网机已清空包文件，仅剩数据库"

      - name: '外网机 — 增量 sync（只剩 .store.db 无外网包文件）'
        run: |
          set -euo pipefail
          cd /tmp/wan
          $PIP_MIRROR_BIN sync -c "$GITHUB_WORKSPACE/wan-inc.toml" 2>&1 | tee sync.log
          ls -lh incremental/incremental_*.tar.zst
          ARCHIVE=$(realpath incremental/incremental_*.tar.zst | head -1)
          echo "INCREMENTAL=$ARCHIVE" >> "$GITHUB_ENV"
          # 列出增量包内容
          tar -taf "$ARCHIVE" | tee /tmp/inc-list.txt
          # 增量包必须含新增的三个深依赖包
          for pkg in gradio streamlit markitdown; do
            if ! grep -qE "^simple/${pkg}/" /tmp/inc-list.txt; then
              echo "BUG: incremental tar 缺少 simple/${pkg}/"
              exit 1
            fi
          done
          echo "增量包验证通过: 包含 gradio / streamlit / markitdown"

      - name: 'artifact 转移 — 增量包 + .store.db 外网→内网'
        run: |
          set -euo pipefail
          cp "$INCREMENTAL" /tmp/lan/
          # 外网的 .store.db 已包含两次同步的完整记录，覆盖内网旧 db
          cp /tmp/wan/packages/.store.db /tmp/lan/packages/
          echo "artifact 转移完成:"
          ls -lh /tmp/lan/incremental_*.tar.zst
          echo "内网 .store.db 记录数: $(sqlite3 /tmp/lan/packages/.store.db 'SELECT COUNT(*) FROM downloaded_files;')"

      - name: '内网机 — import-incremental（现算 sha256 + 重建索引）'
        run: |
          set -euo pipefail
          INC_LOCAL=$(ls /tmp/lan/incremental_*.tar.zst | head -1)
          $PIP_MIRROR_BIN import-incremental "$INC_LOCAL" -c "$GITHUB_WORKSPACE/lan.toml" 2>&1 | tee import.log
          # 验证新增包已入库
          for pkg in gradio streamlit markitdown; do
            N=$(sqlite3 /tmp/lan/packages/.store.db \
              "SELECT COUNT(*) FROM downloaded_files WHERE package_name='${pkg}' AND LENGTH(sha256)=64;")
            echo "${pkg} rows in lan store: $N"
            test "$N" -ge 1
          done
          # 验证新增包索引已重建
          for pkg in gradio streamlit markitdown; do
            test -f "/tmp/lan/packages/simple/${pkg}/index.html"
            test -f "/tmp/lan/packages/simple/${pkg}/index.json"
          done
          # manifest.json 不应被留在仓库根
          if [ -f /tmp/lan/packages/manifest.json ]; then
            echo "BUG: manifest.json should be cleaned up after import"
            exit 1
          fi
          echo "import-incremental 完成，索引已重建，serve 无需重启"

      - name: '客户端第二次下载 — 装增量包（gradio + streamlit + markitdown）'
        run: |
          set -euo pipefail
          uv venv /tmp/client2
          export VIRTUAL_ENV=/tmp/client2
          uv pip install --index-url "http://${MIRROR_HOST}:${MIRROR_PORT}/simple" \
            gradio streamlit "markitdown[pptx,docx,xls,xlsx,pdf]"
          /tmp/client2/bin/python - <<'PY'
          import gradio, streamlit, markitdown
          print("client2 incremental OK",
                "gradio", gradio.__version__,
                "streamlit", streamlit.__version__,
                "markitdown", getattr(markitdown, "__version__", "?"))
          PY

      - name: '客户端第二次下载 — 旧包仍可用（openai + playwright + rapidocr-onnxruntime）'
        run: |
          set -euo pipefail
          uv venv /tmp/client3
          export VIRTUAL_ENV=/tmp/client3
          uv pip install --index-url "http://${MIRROR_HOST}:${MIRROR_PORT}/simple" \
            openai playwright rapidocr-onnxruntime
          /tmp/client3/bin/python - <<'PY'
          import openai, playwright, rapidocr_onnxruntime
          print("client3 old-packages OK",
                "openai", openai.__version__,
                "playwright", getattr(playwright, "__version__", "?"),
                "rapidocr_onnxruntime", getattr(rapidocr_onnxruntime, "__version__", "?"))
          PY

      - name: '--strict happy path（同一增量包再次 import 不报错）'
        run: |
          set -euo pipefail
          INC_LOCAL=$(ls /tmp/lan/incremental_*.tar.zst | head -1)
          $PIP_MIRROR_BIN import-incremental "$INC_LOCAL" -c "$GITHUB_WORKSPACE/lan.toml" --strict 2>&1 | tee strict.log

      - name: 'Stop server'
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
          pkill -f 'pip-mirror serve' 2>/dev/null || true
          echo "===== tail server.log ====="
          tail -100 server.log 2>/dev/null || echo "(no server.log)"

      - name: 'Upload mirror.tar.zst for Windows client job'
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-tarball-${{ github.run_id }}
          path: /tmp/wan/mirror.tar.zst
          retention-days: 1
          if-no-files-found: error

      - name: 'Upload e2e logs'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: |
            /tmp/wan/sync-full.log
            /tmp/wan/sync.log
            import.log
            strict.log
            server.log
            wan-full.toml
            wan-inc.toml
            lan.toml
          retention-days: 7
          if-no-files-found: warn

  e2e-windows-client:
    needs: e2e
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      MIRROR_HOST: 127.0.0.1
      MIRROR_PORT: '18080'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: 'Build pip-mirror (Windows Rust)'
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc
          # Python script expects the binary under target/release/
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/pip-mirror.exe target/release/pip-mirror.exe

      - name: 'Download mirror.tar.zst from linux job'
        uses: actions/download-artifact@v4
        with:
          name: mirror-tarball-${{ github.run_id }}
          path: .

      - name: '安装 Python 依赖（zstandard 用于解压 tar.zst）'
        run: uv pip install --system zstandard

      - name: 'Mode 3 — serve + Windows 客户端验证（Python 脚本）'
        run: python scripts/e2e_windows_client_mode3.py

      - name: 'Upload windows client logs'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-logs-${{ github.run_id }}
          path: |
            server.log
            server.err
            stage.toml
          retention-days: 7
          if-no-files-found: warn
