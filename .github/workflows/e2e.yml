name: E2E (Four Modes)

# 端到端测试,串完 pip-mirror 对外四种模式 + 真实客户端验证。
# 包列表与 pyproject.toml 的 [tool.pip-mirror].packages 保持一致(36 包,
# 含 markitdown[pptx,docx,xls,xlsx,pdf]),不偷工。CI 上 CPU 弱网络强,所以:
#   - workers 在 CI 配置里拉到 16(只写在 e2e 生成的 toml 里,不改 pyproject)
#   - PIP_MIRROR_TAR_COMPRESSION=none → mirror.tar.gz 内部 gzip level=0,基本不压缩
# 流程(对照 README "四种使用模式"):
#   1) 模式二 sync-full    → 在 workspace 产 mirror.tar.gz + mirror.sha256
#   2) 模拟内网            → 解到 /tmp/stage,验证 simple/ 与 python-builds/ 都在
#   3) 模式三 serve(后台)→ 用 stage 仓库做服务
#   4) 客户端 uv pip install requests              走镜像装 wheel
#   5) 客户端 uv python install 3.13               走镜像装 cpython,验证 python-builds 链路
#   6) 模式一 sync          → 加一个 pyproject.toml 没有的包(setuptools)触发 incremental_*.tar.gz
#   7) import-incremental   → 现算 sha256 写入 stage 的 store.db,客户端立即可装 setuptools
#   8) --strict happy path  → 同一个 archive 再 import 一次,strict 不报错
# 模式四(docker build)不在 e2e 内,因为它的产出物是镜像而非数据,与运行时验证无关。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIRROR_HOST: 127.0.0.1
      MIRROR_PORT: '18080'
      PIP_MIRROR_TAR_COMPRESSION: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install pip-mirror deps
        run: uv sync --no-dev

      - name: 'Generate three configs from pyproject.toml(不动 pyproject 本身)'
        run: |
          set -euo pipefail
          python <<'PY'
          import tomllib
          from pathlib import Path

          src = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          base = src["tool"]["pip-mirror"]
          base_pkgs = list(base["packages"])

          def write_config(path, *, packages, repository_dir):
              lines = ["packages = ["]
              for p in packages:
                  lines.append(f'    "{p}",')
              lines.append("]")
              lines.append(f'repository_dir = "{repository_dir}"')
              lines.append(f'incremental_dir = "{base.get("incremental_dir", "./incremental")}"')
              lines.append(f'include_source = {"true" if base.get("include_source", True) else "false"}')
              lines.append("workers = 16")  # CI 上拉高
              lines.append(f'max_versions = {base.get("max_versions", 5)}')
              lines.append('server_host = "127.0.0.1"')
              lines.append("server_port = 18080")
              Path(path).write_text("\n".join(lines) + "\n", encoding="utf-8")

          # 1) sync-full 用:packages 与 pyproject 一致,repository_dir = workspace 默认
          write_config("e2e-full.toml", packages=base_pkgs, repository_dir="./packages")
          # 2) stage 用(serve + import-incremental):packages 一致,repository_dir 指向 /tmp/stage/packages
          write_config("stage.toml", packages=base_pkgs, repository_dir="/tmp/stage/packages")
          # 3) 增量 sync 用:packages = pyproject 列表 + setuptools(pyproject 没有的包,以触发增量)
          write_config("e2e-inc.toml", packages=[*base_pkgs, "setuptools"], repository_dir="./packages")

          print(f"base packages: {len(base_pkgs)}")
          print("generated: e2e-full.toml stage.toml e2e-inc.toml")
          PY
          echo "----- e2e-full.toml(尾部) -----"
          tail -15 e2e-full.toml
          echo "----- e2e-inc.toml(尾部) -----"
          tail -15 e2e-inc.toml

      - name: 'Mode 2 — sync-full produces mirror.tar.gz + mirror.sha256(用 pyproject 全集)'
        run: |
          set -euo pipefail
          uv run pip-mirror sync-full -c e2e-full.toml 2>&1 | tee sync-full.log
          ls -lh mirror.tar.gz mirror.sha256
          sha256sum -c mirror.sha256

      - name: 'Stage extracted mirror to /tmp/stage (simulate intranet host)'
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage
          tar -xzf mirror.tar.gz -C /tmp/stage
          test -d /tmp/stage/packages/simple/requests
          test -f /tmp/stage/packages/simple/requests/index.html
          test -f /tmp/stage/packages/simple/requests/index.json
          test -f /tmp/stage/packages/.store.db
          test -f /tmp/stage/packages/python-builds/index.json
          # access_log.db 不应进 mirror.tar.gz
          if [ -f /tmp/stage/packages/.access_log.db ]; then
            echo "BUG: .access_log.db should be filtered out of mirror.tar.gz"
            exit 1
          fi
          echo "----- staged simple/ (head 10) -----"
          ls /tmp/stage/packages/simple/ | head -10
          echo "----- staged python-builds/ (head 5) -----"
          ls /tmp/stage/packages/python-builds/ | head -5
          echo "python-builds index entries: $(python -c 'import json; print(len(json.load(open(\"/tmp/stage/packages/python-builds/index.json\"))))')"
          echo "----- 仓库尺寸 -----"
          du -sh /tmp/stage/packages

      - name: 'Mode 3 — start serve in background'
        run: |
          set -euo pipefail
          uv run pip-mirror serve -c stage.toml > server.log 2>&1 &
          echo $! > server.pid
          # 等 server up
          for i in $(seq 1 30); do
            if curl -sf "http://${MIRROR_HOST}:${MIRROR_PORT}/simple/requests/" > /dev/null; then
              echo "server up after ${i}s"
              break
            fi
            sleep 1
          done
          # 必须能拿到 simple/requests/ 与 python-builds/index.json
          curl -sfI "http://${MIRROR_HOST}:${MIRROR_PORT}/simple/requests/" | head -3
          curl -sf "http://${MIRROR_HOST}:${MIRROR_PORT}/python-builds/index.json" \
            | python -c 'import json, sys; d=json.load(sys.stdin); k=next(iter(d)); print(len(d), "entries; first:", k, "->", d[k]["url"])'

      - name: 'Client — uv pip install requests via mirror'
        run: |
          set -euo pipefail
          uv venv /tmp/client
          export VIRTUAL_ENV=/tmp/client
          uv pip install --index-url "http://${MIRROR_HOST}:${MIRROR_PORT}/simple" requests
          /tmp/client/bin/python -c "import requests; print('client requests', requests.__version__)"

      - name: 'Client — uv python install 3.13 via mirror python-builds index'
        run: |
          set -euo pipefail
          export UV_PYTHON_DOWNLOADS_JSON_URL="http://${MIRROR_HOST}:${MIRROR_PORT}/python-builds/index.json"
          export UV_PYTHON_INSTALL_DIR=/tmp/uv-pythons
          uv python install 3.13
          ls /tmp/uv-pythons
          PYBIN=$(uv python find 3.13)
          echo "uv python find 3.13 → $PYBIN"
          "$PYBIN" --version
          # 确认服务器真的被打过 python-builds 流量(不是 uv 走了上游)
          PYHITS=$(sqlite3 /tmp/stage/packages/.access_log.db \
            "SELECT COUNT(*) FROM access_log WHERE path LIKE '/python-builds/%';")
          echo "python-builds hits in mirror access_log: $PYHITS"
          test "$PYHITS" -ge 1

      - name: 'Mode 1 — incremental sync(在 pyproject 列表外加 setuptools 触发增量)'
        run: |
          set -euo pipefail
          uv run pip-mirror sync -c e2e-inc.toml 2>&1 | tee sync.log
          ls -lh incremental/incremental_*.tar.gz
          ARCHIVE=$(ls incremental/incremental_*.tar.gz | head -1)
          echo "INCREMENTAL=$ARCHIVE" >> "$GITHUB_ENV"
          # 增量包必须含 setuptools;不该再含已同步的 requests
          tar -tzf "$ARCHIVE" | tee /tmp/inc-list.txt
          grep -E '^simple/setuptools/' /tmp/inc-list.txt
          if grep -E '^simple/requests/' /tmp/inc-list.txt; then
            echo "BUG: incremental should NOT re-include already-synced requests files"
            exit 1
          fi

      - name: 'import-incremental into stage(recompute sha256)'
        run: |
          set -euo pipefail
          uv run pip-mirror import-incremental "$INCREMENTAL" -c stage.toml 2>&1 | tee import.log
          # stage 的 .store.db 必须有 setuptools 行,且 sha256 长度 64
          NSET=$(sqlite3 /tmp/stage/packages/.store.db \
            "SELECT COUNT(*) FROM downloaded_files WHERE package_name='setuptools' AND LENGTH(sha256)=64;")
          echo "setuptools rows in stage store: $NSET"
          test "$NSET" -ge 1
          # 索引也要被重建
          test -f /tmp/stage/packages/simple/setuptools/index.html
          test -f /tmp/stage/packages/simple/setuptools/index.json
          # manifest.json 不应被留在仓库根
          if [ -f /tmp/stage/packages/manifest.json ]; then
            echo "BUG: manifest.json should be cleaned up after import"
            exit 1
          fi

      - name: 'Client — uv pip install setuptools (now served by live mirror)'
        run: |
          set -euo pipefail
          export VIRTUAL_ENV=/tmp/client
          uv pip install --index-url "http://${MIRROR_HOST}:${MIRROR_PORT}/simple" setuptools
          /tmp/client/bin/python -c "import setuptools; print('client setuptools', setuptools.__version__)"

      - name: '--strict happy path (re-import succeeds, no failures)'
        run: |
          set -euo pipefail
          uv run pip-mirror import-incremental "$INCREMENTAL" -c stage.toml --strict 2>&1 | tee strict.log

      - name: 'Stop server'
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
          pkill -f 'pip-mirror serve' 2>/dev/null || true
          echo "===== tail server.log ====="
          tail -100 server.log 2>/dev/null || echo "(no server.log)"

      - name: 'Upload e2e logs'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: |
            sync-full.log
            sync.log
            import.log
            strict.log
            server.log
            mirror.sha256
            e2e-full.toml
            stage.toml
            e2e-inc.toml
          retention-days: 7
          if-no-files-found: warn
