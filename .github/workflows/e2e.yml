name: E2E (Four Modes)

# 端到端测试,串完 pip-mirror 对外四种模式 + 真实客户端验证。
# 包列表与 pyproject.toml 的 [tool.pip-mirror].packages 保持一致(35 包,
# 含 markitdown[pptx,docx,xls,xlsx,pdf]),不偷工。CI 上 CPU 弱网络强,所以:
#   - workers 在 CI 配置里拉到 16(只写在 e2e 生成的 toml 里,不改 pyproject)
#   - PIP_MIRROR_TAR_COMPRESSION=none → mirror.tar.gz 内部 gzip level=0,基本不压缩
# 流程(对照 README "四种使用模式"):
#   1) 模式二 sync-full    → 在 workspace 产 mirror.tar.gz + mirror.sha256
#   2) 模拟内网            → 解到 /tmp/stage,验证 simple/ 与 python-builds/ 都在
#   3) 模式三 serve(后台)→ 用 stage 仓库做服务
#   4) 客户端 uv pip install requests              走镜像装 wheel
#   5) 客户端 uv python install 3.13               走镜像装 cpython,验证 python-builds 链路
#   6) 模式一 sync          → 加一个 pyproject.toml 没有的包(setuptools)触发 incremental_*.tar.gz
#   7) import-incremental   → 现算 sha256 写入 stage 的 store.db,客户端立即可装 setuptools
#   8) --strict happy path  → 同一个 archive 再 import 一次,strict 不报错
# 模式四(docker build)不在 e2e 内,因为它的产出物是镜像而非数据,与运行时验证无关。

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIRROR_HOST: 127.0.0.1
      MIRROR_PORT: '18080'
      PIP_MIRROR_TAR_COMPRESSION: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Build pip-mirror (Rust)
        run: |
          set -euo pipefail
          rustup default stable
          cargo build --release
          echo "PIP_MIRROR_BIN=$(pwd)/target/release/pip-mirror" >> "$GITHUB_ENV"

      - name: 'Generate e2e configs'
        run: |
          set -euo pipefail
          cat > e2e-full.toml <<'TOML'
          packages = [
              "gradio",
              "markitdown[pptx,docx,xls,xlsx,pdf]",
              "rapidocr-onnxruntime",
              "pyside6",
              "playwright",
              "openai",
          ]
          repository_dir = "./packages"
          incremental_dir = "./incremental"
          include_source = true
          workers = 16
          max_versions = 5
          max_depth = 3
          server_host = "127.0.0.1"
          server_port = 18080
          TOML
          sed 's|repository_dir = "./packages"|repository_dir = "/tmp/stage/packages"|' \
            e2e-full.toml > stage.toml
          cat > e2e-inc.toml <<'TOML'
          packages = [
              "gradio",
              "markitdown[pptx,docx,xls,xlsx,pdf]",
              "rapidocr-onnxruntime",
              "pyside6",
              "playwright",
              "openai",
              "setuptools",
          ]
          repository_dir = "./packages"
          include_source = true
          workers = 16
          max_versions = 5
          server_host = "127.0.0.1"
          server_port = 18080
          TOML
          echo "----- e2e-full.toml -----"
          cat e2e-full.toml
          echo "----- e2e-inc.toml -----"
          cat e2e-inc.toml

      - name: 'Mode 2 — sync-full produces mirror.tar.gz + mirror.sha256(用 pyproject 全集)'
        run: |
          set -euo pipefail
          $PIP_MIRROR_BIN sync-full -c e2e-full.toml 2>&1 | tee sync-full.log
          ls -lh mirror.tar.gz mirror.sha256
          sha256sum -c mirror.sha256

      - name: 'Stage extracted mirror to /tmp/stage (simulate intranet host)'
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage
          tar -xzf mirror.tar.gz -C /tmp/stage
          test -d /tmp/stage/packages/simple/requests
          test -f /tmp/stage/packages/simple/requests/index.html
          test -f /tmp/stage/packages/simple/requests/index.json
          test -f /tmp/stage/packages/.store.db
          test -f /tmp/stage/packages/python-builds/index.json
          # access_log.db 不应进 mirror.tar.gz
          if [ -f /tmp/stage/packages/.access_log.db ]; then
            echo "BUG: .access_log.db should be filtered out of mirror.tar.gz"
            exit 1
          fi
          echo "----- staged simple/ (head 10) -----"
          ls /tmp/stage/packages/simple/ | head -10
          echo "----- staged python-builds/ (head 5) -----"
          ls /tmp/stage/packages/python-builds/ | head -5
          echo "python-builds index entries: $(python -c 'import json; print(len(json.load(open("/tmp/stage/packages/python-builds/index.json"))))')"
          echo "----- 仓库尺寸 -----"
          du -sh /tmp/stage/packages

      - name: 'Mode 3 — start serve in background'
        run: |
          set -euo pipefail
          $PIP_MIRROR_BIN serve -c stage.toml > server.log 2>&1 &
          echo $! > server.pid
          # 等 server up
          for i in $(seq 1 30); do
            if curl -sf "http://${MIRROR_HOST}:${MIRROR_PORT}/simple/requests/" > /dev/null; then
              echo "server up after ${i}s"
              break
            fi
            sleep 1
          done
          # 必须能拿到 simple/requests/ 与 python-builds/index.json
          curl -sfI "http://${MIRROR_HOST}:${MIRROR_PORT}/simple/requests/" | head -3
          curl -sf "http://${MIRROR_HOST}:${MIRROR_PORT}/python-builds/index.json" \
            | python -c 'import json, sys; d=json.load(sys.stdin); k=next(iter(d)); print(len(d), "entries; first:", k, "->", d[k]["url"])'

      - name: 'Client — uv pip install requests via mirror'
        run: |
          set -euo pipefail
          uv venv /tmp/client
          export VIRTUAL_ENV=/tmp/client
          uv pip install --index-url "http://${MIRROR_HOST}:${MIRROR_PORT}/simple" requests
          /tmp/client/bin/python -c "import requests; print('client requests', requests.__version__)"

      - name: 'Client — uv python install 3.13 via mirror python-builds index'
        run: |
          set -euo pipefail
          export UV_PYTHON_DOWNLOADS_JSON_URL="http://${MIRROR_HOST}:${MIRROR_PORT}/python-builds/index.json"
          export UV_PYTHON_INSTALL_DIR=/tmp/uv-pythons
          uv python install 3.13
          ls /tmp/uv-pythons
          PYBIN=$(uv python find 3.13)
          echo "uv python find 3.13 → $PYBIN"
          "$PYBIN" --version
          # 确认服务器真的被打过 python-builds 流量(不是 uv 走了上游)
          PYHITS=$(sqlite3 /tmp/stage/packages/.access_log.db \
            "SELECT COUNT(*) FROM access_log WHERE path LIKE '/python-builds/%';")
          echo "python-builds hits in mirror access_log: $PYHITS"
          test "$PYHITS" -ge 1

      - name: 'Mode 1 — incremental sync(在 pyproject 列表外加 setuptools 触发增量)'
        run: |
          set -euo pipefail
          $PIP_MIRROR_BIN sync -c e2e-inc.toml 2>&1 | tee sync.log
          ls -lh incremental/incremental_*.tar.gz
          ARCHIVE=$(ls incremental/incremental_*.tar.gz | head -1)
          echo "INCREMENTAL=$ARCHIVE" >> "$GITHUB_ENV"
          # 增量包必须含 setuptools;不该再含已同步的 requests
          tar -tzf "$ARCHIVE" | tee /tmp/inc-list.txt
          grep -E '^simple/setuptools/' /tmp/inc-list.txt
          if grep -E '^simple/requests/' /tmp/inc-list.txt; then
            echo "BUG: incremental should NOT re-include already-synced requests files"
            exit 1
          fi

      - name: 'import-incremental into stage(recompute sha256)'
        run: |
          set -euo pipefail
          $PIP_MIRROR_BIN import-incremental "$INCREMENTAL" -c stage.toml 2>&1 | tee import.log
          # stage 的 .store.db 必须有 setuptools 行,且 sha256 长度 64
          NSET=$(sqlite3 /tmp/stage/packages/.store.db \
            "SELECT COUNT(*) FROM downloaded_files WHERE package_name='setuptools' AND LENGTH(sha256)=64;")
          echo "setuptools rows in stage store: $NSET"
          test "$NSET" -ge 1
          # 索引也要被重建
          test -f /tmp/stage/packages/simple/setuptools/index.html
          test -f /tmp/stage/packages/simple/setuptools/index.json
          # manifest.json 不应被留在仓库根
          if [ -f /tmp/stage/packages/manifest.json ]; then
            echo "BUG: manifest.json should be cleaned up after import"
            exit 1
          fi

      - name: 'Client — uv pip install setuptools (now served by live mirror)'
        run: |
          set -euo pipefail
          export VIRTUAL_ENV=/tmp/client
          uv pip install --index-url "http://${MIRROR_HOST}:${MIRROR_PORT}/simple" setuptools
          /tmp/client/bin/python -c "import setuptools; print('client setuptools', setuptools.__version__)"

      - name: '--strict happy path (re-import succeeds, no failures)'
        run: |
          set -euo pipefail
          $PIP_MIRROR_BIN import-incremental "$INCREMENTAL" -c stage.toml --strict 2>&1 | tee strict.log

      - name: 'Stop server'
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
          pkill -f 'pip-mirror serve' 2>/dev/null || true
          echo "===== tail server.log ====="
          tail -100 server.log 2>/dev/null || echo "(no server.log)"

      - name: 'Upload mirror.tar.gz for Windows client job'
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-tarball-${{ github.run_id }}
          path: mirror.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: 'Upload e2e logs'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: |
            sync-full.log
            sync.log
            import.log
            strict.log
            server.log
            mirror.sha256
            e2e-full.toml
            stage.toml
            e2e-inc.toml
          retention-days: 7
          if-no-files-found: warn

  e2e-windows-client:
    needs: e2e
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MIRROR_HOST: 127.0.0.1
      MIRROR_PORT: '18080'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: 'Build pip-mirror (Windows Rust)'
        run: |
          rustup default stable
          cargo build --release

      - name: 'Download mirror.tar.gz from linux job'
        uses: actions/download-artifact@v4
        with:
          name: mirror-tarball-${{ github.run_id }}
          path: .

      - name: 'Extract mirror to C:\stage (verify simple/ + python-builds/)'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path C:\stage -Force | Out-Null
          tar -xzf mirror.tar.gz -C C:\stage
          if (-not (Test-Path 'C:\stage\packages\simple\requests\index.html')) {
            throw 'simple/requests/index.html missing after extract'
          }
          if (-not (Test-Path 'C:\stage\packages\.store.db')) {
            throw '.store.db missing after extract'
          }
          if (-not (Test-Path 'C:\stage\packages\python-builds\index.json')) {
            throw 'python-builds/index.json missing after extract'
          }
          Write-Host 'staged simple/ (head 10):'
          Get-ChildItem C:\stage\packages\simple | Select-Object -First 10 | ForEach-Object { $_.Name }

      - name: 'Generate stage.toml for Windows serve'
        shell: pwsh
        run: |
          @'
          packages = ["requests"]
          repository_dir = "C:/stage/packages"
          server_host = "127.0.0.1"
          server_port = 18080
          '@ | Out-File -Encoding utf8 -FilePath stage.toml

      - name: 'Mode 3 — start serve in background (Windows)'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "$(Get-Location)\target\release\pip-mirror.exe"
          $proc = Start-Process -PassThru -WindowStyle Hidden `
            -FilePath $bin -ArgumentList 'serve','-c','stage.toml' `
            -RedirectStandardOutput server.log -RedirectStandardError server.err
          $proc.Id | Out-File -Encoding ascii server.pid
          $up = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing `
                -Uri "http://$($env:MIRROR_HOST):$($env:MIRROR_PORT)/simple/requests/" `
                -TimeoutSec 5 | Out-Null
              Write-Host "server up after $i s"
              $up = $true
              break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) {
            Write-Host '----- server.log -----'
            if (Test-Path server.log) { Get-Content server.log }
            Write-Host '----- server.err -----'
            if (Test-Path server.err) { Get-Content server.err }
            throw 'server did not come up within 60 s'
          }

      - name: 'Client — uv pip install requests via mirror (Windows)'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv venv C:\client
          $env:VIRTUAL_ENV = 'C:\client'
          uv pip install --index-url "http://$($env:MIRROR_HOST):$($env:MIRROR_PORT)/simple" requests
          & C:\client\Scripts\python.exe -c "import requests; print('client requests', requests.__version__)"

      - name: 'Assert installed wheel really has Windows Tag (charset_normalizer)'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VIRTUAL_ENV = 'C:\client'
          # charset_normalizer 在 requests 3.x 链路中是 binary wheel,且 PyPI 多版本含 win_amd64 + win32 build。
          # 如未来 charset-normalizer 全转 pure-python (any wheel),换成 cryptography / pydantic-core / pillow。
          $info = Get-ChildItem C:\client\Lib\site-packages -Directory `
            | Where-Object { $_.Name -like 'charset_normalizer-*.dist-info' } | Select-Object -First 1
          if (-not $info) { throw 'charset_normalizer dist-info not found in C:\client' }
          $wheelMeta = Join-Path $info.FullName 'WHEEL'
          if (-not (Test-Path $wheelMeta)) { throw "WHEEL meta not found at $wheelMeta" }
          $tagLines = Get-Content $wheelMeta | Where-Object { $_ -match '^Tag:.*(win_amd64|win32)' }
          if (-not $tagLines) {
            Write-Host '----- WHEEL contents -----'
            Get-Content $wheelMeta
            throw 'installed charset_normalizer is NOT a Windows wheel — backfill missed?'
          }
          Write-Host "OK: charset_normalizer installed wheel tag(s):"
          $tagLines | ForEach-Object { Write-Host "  $_" }

      - name: 'Client — uv python install 3.13 via mirror python-builds index (Windows)'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:UV_PYTHON_DOWNLOADS_JSON_URL = "http://$($env:MIRROR_HOST):$($env:MIRROR_PORT)/python-builds/index.json"
          $env:UV_PYTHON_INSTALL_DIR = 'C:\uv-pythons'
          uv python install 3.13
          $pybin = (uv python find 3.13).Trim()
          Write-Host "uv python find 3.13 -> $pybin"
          & "$pybin" --version
          $hits = & sqlite3 'C:\stage\packages\.access_log.db' "SELECT COUNT(*) FROM access_log WHERE path LIKE '/python-builds/%';"
          Write-Host "python-builds hits in mirror access_log: $hits"
          if ([int]$hits -lt 1) {
            throw 'access_log has zero /python-builds/ hits — uv may have bypassed mirror'
          }

      - name: 'Stop serve (Windows)'
        if: always()
        shell: pwsh
        run: |
          if (Test-Path server.pid) {
            $pidVal = Get-Content server.pid
            try { Stop-Process -Id ([int]$pidVal) -Force -ErrorAction SilentlyContinue } catch {}
          }
          Get-Process -Name 'pip-mirror' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host '===== tail server.log ====='
          if (Test-Path server.log) { Get-Content server.log -Tail 100 }
          Write-Host '===== tail server.err ====='
          if (Test-Path server.err) { Get-Content server.err -Tail 100 }

      - name: 'Upload windows client logs'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-logs-${{ github.run_id }}
          path: |
            server.log
            server.err
            stage.toml
          retention-days: 7
          if-no-files-found: warn
