name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'
      - run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check src/pip_mirror tests
      - name: Run tests (pytest)
        run: uv run pytest tests/ -v
