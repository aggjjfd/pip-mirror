# Host 网络模式:容器直接共享 host 网络栈,server 看到的 client_address[0]
# 即真实客户端 IP,access_logger 的 IP 统计能正常区分内网各客户端。
#
# 数据持久化:
#   ./packages 挂到 /repo/packages,内含 simple/、python-builds/ 与
#   .store.db / .access_log.db。容器重启数据全部保留在 host。
#
# 部署流程(全量首次):
#   1) 在外网机上 `pip-mirror sync-full` 产出 mirror.tar.zst + mirror.sha256
#      (或从 GitHub Actions 的 sync 工作流 artifact 下载)
#   2) 拷到内网 host,在本目录下 `tar -xaf mirror.tar.zst` 解出 ./packages
#   3) docker compose up -d
#   4) 客户端走 http://<host-ip>:8080/simple
#
# 增量更新:
#   1) 外网机 `pip-mirror sync` 后,把 incremental/incremental_*.tar.zst 拷到 host
#   2) docker compose exec pip-mirror pip-mirror import-incremental \
#         /repo/packages/incremental_*.tar.zst
#      (容器内的 ./packages == host 的 ./packages)
#
services:
  pip-mirror:
    build: .
    image: pip-mirror:latest
    container_name: pip-mirror
    network_mode: host
    volumes:
      - ./packages:/repo/packages
    restart: unless-stopped
