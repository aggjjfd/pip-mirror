[project]
name = "pip-mirror"
version = "0.1.0"
description = "轻量级私有 PIP 仓库，支持增量同步"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "packaging>=24.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "tqdm>=4.66.0",
    "colorlog>=6.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
pip-mirror = "pip_mirror.cli:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP"]

[tool.pip-mirror]
packages = [
    "gradio",
    "openai",
    "streamlit",
    "openpyxl",
    "xlrd",
    "pywin32",
    "shapely",
    "tomli",
    "python-dotenv",
    "requests",
    "tqdm",
    "colorama",
    "uv",
    "duckdb",
    "gooey",
    "pyside5",
    "pyside6",
    "pyinstaller",
    "pytest",
    "ruff",
    "mypy",
    "hatchling",
    "pydantic",
    "uvicorn",
    "fastapi",
    "loguru",
    "pypdf",
    "pymupdf",
    "pillow",
    "onnxruntime",
    "rapidocr-onnxruntime",
    "pypinyin",
    "jieba",
    "soundfile",
    "playwright",
    "markitdown[pptx,docx,xls,xlsx,pdf]",
]
repository_dir = "./packages"
incremental_dir = "./incremental"
include_source = true
workers = 8
max_versions = 5
server_port = 8080
server_host = "0.0.0.0"
