# 要同步的包列表，支持 extras（如 markitdown[pptx,docx]），
# 也支持直接指定 whl 下载 URL（http/https/file）
packages = [
    # 远程 whl URL（参与依赖解析：会读取 METADATA 并同步其 Requires-Dist）
    # { url = "https://example.com/mypkg-1.0-py3-none-any.whl" },
    # 本地 whl URL，可选项 sha256 = "..."
    # { url = "file:///opt/wheels/mypkg-1.0-py3-none-any.whl" },
    "gradio",
    "openai",
    "streamlit",
    "openpyxl",
    "xlsxwriter",
    "pyxlsb",
    "xlrd",
    "python-docx",
    "python-pptx",
    "pywin32",
    "pywinauto",
    "shapely",
    "geopandas",
    "folium",
    "geopy",
    "tomli",
    "python-dotenv",
    "requests",
    "six",
    "tqdm",
    "colorama",
    "uv",
    "duckdb",
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "matplotlib",
    "seaborn",
    "gooey",
    "pyside6",
    "pyinstaller",
    "pytest",
    "ruff",
    "mypy",
    "hatchling",
    "pydantic",
    "uvicorn",
    "fastapi",
    "loguru",
    "pypdf",
    "pymupdf",
    "pillow",
    "onnxruntime",
    "rapidocr-onnxruntime",
    "pypinyin",
    "jieba",
    "soundfile",
    "playwright",
    "markitdown[pptx,docx,xls,xlsx,pdf]",
]

# 包仓库本地存储目录
repository_dir = "./packages"

# 增量同步临时目录
incremental_dir = "./incremental"

# PyPI 官方 API 地址，用于获取元数据
pypi_url = "https://pypi.org"

# 国内镜像 simple 索引地址，用于下载 wheel
index_url = "https://mirrors.ustc.edu.cn/pypi/simple"

# 源码包仅作为 wheel 不可用时的回退，且仅允许纯 Python 回退候选
include_source = true

# 依赖解析并发数
resolve_workers = 8

# 元数据获取并发数
metadata_workers = 32

# 文件下载并发数
download_workers = 8

# 每个包每侧保留的相邻版本数（0 = 不保留相邻版本）
adjacent_versions_per_side = 2

# 每个包保留的最新版本数
top_versions_per_package = 5

# 是否允许预发布版本
allow_prerelease = false

# Linux 最大支持的 glibc 版本（影响 manylinux 标签过滤）
linux_max_glibc = "2.39"

# 服务器监听地址
server_host = "0.0.0.0"

# 服务器监听端口
server_port = 8080

# 解析目标环境（Python 版本 × 操作系统 × 架构）
# 不配置时默认覆盖全部内置组合
# python: Python 版本号，如 "3.10" 或 "3.10.0"
# os:     操作系统，支持 "linux" | "windows"
# arch:   架构，支持 "x64" | "x86"（windows 下 x86 仅 Python 3.8 支持）
# targets = [
#     { python = "3.10", os = "linux", arch = "x64" },
#     { python = "3.11", os = "linux", arch = "x64" },
#     { python = "3.10", os = "windows", arch = "x64" },
# ]
